<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#sky4)"/>
  <!-- ビル群（遠景） -->
  <rect x="0"   y="80"  width="60"  height="120" fill="#c7d2fe" opacity="0.5"/>
  <rect x="55"  y="100" width="45"  height="100" fill="#a5b4fc" opacity="0.5"/>
  <rect x="680" y="90"  width="55"  height="110" fill="#c7d2fe" opacity="0.5"/>
  <rect x="730" y="70"  width="70"  height="130" fill="#a5b4fc" opacity="0.5"/>
  <!-- メインのオフィスビル -->
  <rect x="250" y="40"  width="100" height="160" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
  <rect x="350" y="60"  width="80"  height="140" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="420" y="30"  width="130" height="170" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <!-- ビルの窓 -->
  <g fill="#93c5fd" opacity="0.7">
    <rect x="260" y="55"  width="12" height="10" rx="1"/>
    <rect x="278" y="55"  width="12" height="10" rx="1"/>
    <rect x="296" y="55"  width="12" height="10" rx="1"/>
    <rect x="260" y="72"  width="12" height="10" rx="1"/>
    <rect x="278" y="72"  width="12" height="10" rx="1"/>
    <rect x="296" y="72"  width="12" height="10" rx="1"/>
    <rect x="260" y="89"  width="12" height="10" rx="1"/>
    <rect x="278" y="89"  width="12" height="10" rx="1"/>
    <rect x="260" y="106" width="12" height="10" rx="1"/>
    <rect x="296" y="106" width="12" height="10" rx="1"/>
  </g>
  <g fill="#a5b4fc" opacity="0.7">
    <rect x="430" y="45"  width="15" height="12" rx="1"/>
    <rect x="452" y="45"  width="15" height="12" rx="1"/>
    <rect x="474" y="45"  width="15" height="12" rx="1"/>
    <rect x="496" y="45"  width="15" height="12" rx="1"/>
    <rect x="430" y="65"  width="15" height="12" rx="1"/>
    <rect x="452" y="65"  width="15" height="12" rx="1"/>
    <rect x="474" y="65"  width="15" height="12" rx="1"/>
    <rect x="430" y="85"  width="15" height="12" rx="1"/>
    <rect x="474" y="85"  width="15" height="12" rx="1"/>
    <rect x="496" y="85"  width="15" height="12" rx="1"/>
  </g>
  <!-- 地面・道路 -->
  <rect x="0" y="185" width="800" height="15" fill="#6b7280" opacity="0.4"/>
  <rect x="0" y="188" width="800" height="2"  fill="#d1d5db" opacity="0.8"/>
</svg>
