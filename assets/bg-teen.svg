<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#sky3)"/>
  <!-- 遠景の山 -->
  <polygon points="0,200 150,80 300,200" fill="#a7f3d0" opacity="0.7"/>
  <polygon points="200,200 380,60 560,200" fill="#6ee7b7" opacity="0.6"/>
  <polygon points="500,200 680,90 800,200" fill="#a7f3d0" opacity="0.7"/>
  <!-- 地面 -->
  <rect x="0" y="165" width="800" height="35" fill="#d1fae5"/>
  <!-- 高校（シルエット） -->
  <rect x="310" y="80" width="180" height="90" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="330" y="60" width="140" height="25" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1"/>
  <rect x="380" y="125" width="25" height="45" fill="#0ea5e9" opacity="0.5"/>
  <!-- 桜の木 -->
  <rect x="145" y="120" width="8" height="50" fill="#92400e"/>
  <ellipse cx="149" cy="108" rx="38" ry="32" fill="#f9a8d4" opacity="0.85"/>
  <ellipse cx="138" cy="118" rx="22" ry="18" fill="#fda4af" opacity="0.7"/>
  <!-- 自転車 -->
  <circle cx="640" cy="160" r="14" fill="none" stroke="#047857" stroke-width="3"/>
  <circle cx="610" cy="160" r="14" fill="none" stroke="#047857" stroke-width="3"/>
  <line x1="610" y1="160" x2="625" y2="145" stroke="#047857" stroke-width="2.5"/>
  <line x1="625" y1="145" x2="640" y2="160" stroke="#047857" stroke-width="2.5"/>
  <line x1="625" y1="145" x2="625" y2="135" stroke="#047857" stroke-width="2.5"/>
</svg>
